<div class="comparador" (pointerdown)="empezar($event)" (pointermove)="mover($event)" (pointerup)="soltar()" (pointercancel)="soltar()">
  <!-- Después: la prenda puesta en el avatar -->
  <div class="comparador-capa comparador-despues" aria-hidden="true">
    <div class="absolute inset-x-12 bottom-0 top-12 rounded-t-[160px] bg-oliva-tenue"></div>
    <svg class="absolute inset-0 m-auto h-[82%]" viewBox="0 0 200 400" fill="none">
      <defs>
        <pattern id="cmp-rayas" width="12" height="12" patternUnits="userSpaceOnUse">
          <rect width="12" height="12" fill="#f4f1ea" /><rect width="12" height="4.5" fill="#1f2a44" />
        </pattern>
        <linearGradient id="cmp-sombra" x1="0" x2="1">
          <stop offset="0" stop-color="#000" stop-opacity=".18" /><stop offset=".35" stop-color="#000" stop-opacity="0" />
          <stop offset=".7" stop-color="#000" stop-opacity="0" /><stop offset="1" stop-color="#000" stop-opacity=".2" />
        </linearGradient>
      </defs>
      <circle cx="100" cy="42" r="23" fill="#bdb8ae" />
      <rect x="91" y="60" width="18" height="18" fill="#bdb8ae" />
      <path d="M48 196 52 132 70 98h60l18 34 4 64-12 3-6-48-2 52H66l-2-52-6 48z" fill="#bdb8ae" opacity=".95" />
      <path d="M62 84c10-6 24-9 38-9s28 3 38 9l20 58-18 8-8-26 2 72H66l2-72-8 26-18-8z" fill="url(#cmp-rayas)" />
      <path d="M62 84c10-6 24-9 38-9s28 3 38 9l20 58-18 8-8-26 2 72H66l2-72-8 26-18-8z" fill="url(#cmp-sombra)" />
      <path d="M86 78q14 10 28 0" stroke="#1f2a44" stroke-width="3" />
      <path d="M66 214h68l8 150h-28l-12-112-4 0-12 112H58z" fill="#3b5578" />
      <path d="M66 214h68l1 10H65z" fill="#2c4262" />
      <path d="M56 364h32v12H50zM112 364h32l6 12h-38z" fill="#f3f3f3" stroke="#222" stroke-width="2" />
    </svg>
    <span class="comparador-etiqueta right-4">Puesta en tu avatar</span>
  </div>

  <!-- Antes: la foto tal como la subes -->
  <div class="comparador-capa comparador-antes" [style.clip-path]="'inset(0 ' + (100 - posicion()) + '% 0 0)'" aria-hidden="true">
    <svg class="absolute inset-0 h-full w-full" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="500" fill="#ece7dd" />
      <rect y="360" width="400" height="140" fill="#a77b52" />
      <g stroke="#8c6440" stroke-width="2"><path d="M0 390h400M0 425h400M0 460h400" /></g>
      <defs>
        <pattern id="cmp-rayas-foto" width="18" height="18" patternUnits="userSpaceOnUse">
          <rect width="18" height="18" fill="#f4f1ea" /><rect width="18" height="7" fill="#1f2a44" />
        </pattern>
      </defs>
      <path d="M165 120q35 22 70 0l95 50-30 55-30-16 2 165H128l2-165-30 16-30-55z" fill="url(#cmp-rayas-foto)" stroke="#1f2a44" stroke-width="2" transform="rotate(-4 200 260)" />
      <path d="M180 116q20 14 40 0" stroke="#1f2a44" stroke-width="3" fill="none" transform="rotate(-4 200 260)" />
    </svg>
    <span class="comparador-etiqueta left-4">Tu foto</span>
  </div>

  <div class="comparador-divisor" [style.left.%]="posicion()">
    <button type="button" class="comparador-asa" role="slider" aria-label="Comparar foto y avatar" aria-valuemin="5" aria-valuemax="95"
            [attr.aria-valuenow]="posicion()" (keydown)="teclado($event)">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 15L4.5 12l3.75-3M15.75 9l3.75 3-3.75 3" />
      </svg>
    </button>
  </div>
</div>
