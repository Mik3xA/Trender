<div class="comparador" (pointerdown)="empezar($event)" (pointermove)="mover($event)" (pointerup)="soltar()" (pointercancel)="soltar()">
  <!-- Después: la misma foto con la ropa elegida (ilustración) -->
  <div class="comparador-capa" aria-hidden="true">
    <svg class="h-full w-full" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="cmp-rayas" width="16" height="16" patternUnits="userSpaceOnUse">
          <rect width="16" height="16" fill="#f4f1ea" /><rect width="16" height="6" fill="#1f2a44" />
        </pattern>
        <linearGradient id="cmp-luz" x1="0" x2="1">
          <stop offset="0" stop-color="#000" stop-opacity=".16" /><stop offset=".4" stop-color="#000" stop-opacity="0" />
          <stop offset=".75" stop-color="#000" stop-opacity="0" /><stop offset="1" stop-color="#000" stop-opacity=".18" />
        </linearGradient>
      </defs>
      <rect width="400" height="500" fill="#e9e4da" />
      <rect x="250" y="40" width="110" height="150" rx="6" fill="#f4f1ea" stroke="#d8d2c8" stroke-width="4" />
      <rect y="400" width="400" height="100" fill="#d8d2c8" />
      <!-- persona -->
      <path d="M176 70c0-22 12-38 24-38s24 16 24 38-10 34-24 34-24-12-24-34z" fill="#c99a76" />
      <path d="M172 62c2-26 18-36 30-36 16 0 28 12 28 34-6-12-18-18-30-16-12 2-20 8-28 18z" fill="#2b1d14" />
      <rect x="191" y="98" width="18" height="18" fill="#c99a76" />
      <path d="M128 252 136 166c2-20 16-36 34-42 10 10 50 10 60 0 18 6 32 22 34 42l8 86-18 4-12-64-2 70h-120l-2-70-12 64z" fill="url(#cmp-rayas)" />
      <path d="M128 252 136 166c2-20 16-36 34-42 10 10 50 10 60 0 18 6 32 22 34 42l8 86-18 4-12-64-2 70h-120l-2-70-12 64z" fill="url(#cmp-luz)" />
      <path d="M128 252h20l-2 26h-16zM252 252h20l-2 26h-16z" fill="#c99a76" />
      <path d="M140 262h120l10 170h-44l-16-130h-20l-16 130h-44z" fill="#3b5578" />
      <path d="M140 262h120l1 12H139z" fill="#2c4262" />
      <path d="M194 278v40" stroke="#2c4262" stroke-width="2" />
      <path d="M126 432h50v16h-56zM224 432h50l6 16h-56z" fill="#f6f6f4" stroke="#222" stroke-width="2.5" />
    </svg>
    <span class="comparador-etiqueta right-4">Con la ropa elegida</span>
  </div>

  <!-- Antes: tu foto tal como la subes -->
  <div class="comparador-capa" [style.clip-path]="'inset(0 ' + (100 - posicion()) + '% 0 0)'" aria-hidden="true">
    <svg class="h-full w-full" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="500" fill="#e9e4da" />
      <rect x="250" y="40" width="110" height="150" rx="6" fill="#f4f1ea" stroke="#d8d2c8" stroke-width="4" />
      <rect y="400" width="400" height="100" fill="#d8d2c8" />
      <path d="M176 70c0-22 12-38 24-38s24 16 24 38-10 34-24 34-24-12-24-34z" fill="#c99a76" />
      <path d="M172 62c2-26 18-36 30-36 16 0 28 12 28 34-6-12-18-18-30-16-12 2-20 8-28 18z" fill="#2b1d14" />
      <rect x="191" y="98" width="18" height="18" fill="#c99a76" />
      <path d="M140 200 146 160c4-20 14-32 30-36 10 8 38 8 48 0 16 4 26 16 30 36l6 40-14 4-8-30v66H156v-66l-8 30z" fill="#9a9a96" />
      <path d="M134 200h14l4 76h-16zM252 200h14l-2 76h-16z" fill="#c99a76" />
      <path d="M156 262h88l8 170h-38l-14-130-14 130h-38z" fill="#2b2b2d" />
      <path d="M130 432h46v16h-50zM224 432h46l4 16h-50z" fill="#3a2a20" />
    </svg>
    <span class="comparador-etiqueta left-4">Tu foto</span>
  </div>

  <div class="comparador-divisor" [style.left.%]="posicion()">
    <button type="button" class="comparador-asa" role="slider" aria-label="Comparar tu foto con el resultado" aria-valuemin="5" aria-valuemax="95"
            [attr.aria-valuenow]="posicion()" (keydown)="teclado($event)">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 15L4.5 12l3.75-3M15.75 9l3.75 3-3.75 3" />
      </svg>
    </button>
  </div>

  <div class="comparador-prenda" aria-hidden="true">
    <svg viewBox="0 0 60 60" class="h-10 w-10"><defs><pattern id="cmp-r2" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f1ea" /><rect width="8" height="3" fill="#1f2a44" /></pattern></defs>
      <path d="M22 8q8 5 16 0l14 8-5 9-5-3v30H18V22l-5 3-5-9z" fill="url(#cmp-r2)" /></svg>
    <span><strong class="block text-xs">Playera de rayas</strong><span class="text-[11px] opacity-60">de tu armario</span></span>
  </div>
</div>
